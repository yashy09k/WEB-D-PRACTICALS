<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <div class="max-w-md mx-auto mt-10 bg-white p-6 rounded shadow">

        <h2 class="text-2xl font-bold mb-5 text-center">
            Student Registration
        </h2>

        <form id="registrationForm">

            <!-- Name -->
            <label>Student Name</label>
            <input type="text" id="name"
                class="w-full border p-2 mb-3 rounded">

            <!-- Email -->
            <label>Email</label>
            <input type="text" id="email"
                class="w-full border p-2 mb-3 rounded">

            <!-- Password -->
            <label>Password</label>
            <input type="password" id="password"
                class="w-full border p-2 mb-1 rounded">

            <!-- Show Password Checkbox -->
            <div class="mb-3 flex items-center">
            <!--<input type="button" id="showPassword" class="mr-2" onclick="togglePassword()">
                <label for="showPassword" class="text-sm">Show Password</label>/-->

<input type="button" id="showPassword" value="Show Password" onclick="togglePassword()" 
    class="mt-4 px-3 py-1 bg-black-200 hover:bg-blue-300 text-yellow-700 text-xs font-bold cursor-pointer transition">



            </div>

            <!-- Mobile -->
            <label>Mobile Number</label>
            <input type="text" id="mobile"
                class="w-full border p-2 mb-4 rounded">

            <button type="submit"
                class="w-full bg-blue-500 text-white p-2 rounded">
                Register
            </button>

            <p id="message" class="mt-4 text-center"></p>

        </form>
    </div>


    <script>

        function togglePassword() {
            let passwordInput = document.getElementById("password");
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
            } else {
                passwordInput.type = "password";
            }
        }

        document.getElementById("registrationForm").onsubmit = function(event) {

            event.preventDefault();

            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;
            let mobile = document.getElementById("mobile").value;

            let message = document.getElementById("message");

            // Mandatory fields
            if (name == "" || email == "" || password == "" || mobile == "") {
                message.innerHTML = "Please fill all fields.";
                message.className = "mt-4 text-center text-red-500";
                return;
            }

            // Email validation
            if (!email.includes("@") || !email.includes(".")) {
                message.innerHTML = "Enter a valid email.";
                message.className = "mt-4 text-center text-red-500";
                return;
            }

            // Password validation
           

                   if (password.length < 6 || !hasUppercase || !hasLowercase) {
                   message.innerHTML = "Password must be at least 6 characters and contain uppercase and lowercase letters.";
                message.className = "mt-4 text-center text-red-500";
                return;
            }

            // Mobile validation
            if (mobile.length != 10 || isNaN(mobile)) {
                message.innerHTML = "Enter a valid 10-digit mobile number.";
                message.className = "mt-4 text-center text-red-500";
                return;
            }

            // Success
            message.innerHTML = "Registration Successful!";
            message.className = "mt-4 text-center text-green-500";

        };

    </script>

</body>
</html>
